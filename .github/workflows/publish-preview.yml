name: Publish Engine 2.19 preview

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-preview.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Engine 2.19.0 static export
        run: |
          set -euo pipefail
          curl -fsSL -o site.zip "https://litter.catbox.moe/cd9oe4.zip"
          echo "8f74fc3c1ac745ecc1ba0453b513e7ac  site.zip" | md5sum -c
          mkdir _unpack
          unzip -q site.zip -d _unpack
          touch _unpack/.nojekyll
          test -f _unpack/index.html
          test -f _unpack/play/index.html
          test -d _unpack/_expo
      - name: Commit export to main (legacy user Pages)
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name '_unpack' ! -name 'site.zip' -exec rm -rf {} +
          cp -a _unpack/.
          rm -rf _unpack site.zip
          touch .nojekyll
          git config user.email "support@dicefootball.club"
          git config user.name "dfc-preview-bot"
          git add -A
          git commit -m "Publish Engine 2.19.0 recovery preview (ac80da3) static export"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
